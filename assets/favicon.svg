<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Luxury dark background with smooth rounded corners -->
  <rect width="64" height="64" rx="16" fill="#0E0D0C" />
  <!-- Delicate gold hairline border -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1" />
  
  <!-- Stylized Serif Monogram 'NK' -->
  <text x="32" y="43" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="28" font-weight="600" fill="#FAF8F5" text-anchor="middle" letter-spacing="1.5">NK</text>
  
  <!-- Tiny Heirloom Gold Diamond Crest -->
  <polygon points="32,11 34.5,15 32,19 29.5,15" fill="#D4AF37" />
</svg>
